name: Composables stability

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  compose_stability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GIT
        uses: actions/checkout@v4

      - name: Setup Java SDK
        uses: ./.github/actions/setup-pinned-java
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - run: python scripts/verify_environment.py --out build/environment.json

      - name: Build and verify full Compose reports
        run: ./gradlew :app:assembleDemo :ci-actions:compose-stability:run -PivyComposeFullReports=true -Pkotlin.incremental=false --no-configuration-cache

      - name: Upload the Compose Stability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-stability-report
          if-no-files-found: error
          path: |
            ci-actions/compose-stability/ivy-compose-stability-report.txt
            ci-actions/compose-stability/ivy-compose-coverage.tsv
            **/build/compose_full/**
