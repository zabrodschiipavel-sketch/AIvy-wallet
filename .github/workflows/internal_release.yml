name: Promote verified release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Quality workflow run ID
        required: true
        type: string
      head_sha:
        description: Exact 40-character main commit SHA
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version-file: .java-version}
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "build-tools;34.0.0"
      - name: Verify successful quality run and exact main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]]
          [[ "$(gh run view "$RUN_ID" --json workflowName,headSha,conclusion,headBranch,event -q '[.workflowName,.headSha,.conclusion,.headBranch,.event]|@tsv')" == $'Quality\t'"$HEAD_SHA"$'\tsuccess\tmain\tpush' ]]
          [[ "$(gh run view "$RUN_ID" --json url -q .url)" == *"/actions/runs/$RUN_ID"* ]]
      - name: Download candidate from verified run
        env: {GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ inputs.run_id }}'}
        run: gh run download "$RUN_ID" -n "unsigned-release-${{ inputs.head_sha }}" -D candidate
      - name: Verify artifact digest and package, then sign
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          KEYSTORE_B64: ${{ secrets.IVY_SIGNING_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.IVY_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.IVY_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.IVY_SIGNING_KEY_PASSWORD }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,sys
          p=pathlib.Path('candidate/app-release-unsigned.apk'); m=json.loads(pathlib.Path('candidate/candidate.json').read_text())
          assert m['commit']==os.environ['HEAD_SHA'] and m['apk']==p.name and m['package']=='com.ivy.wallet.optimized' and m['variant']=='release'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['sha256']
          assert os.environ['KEYSTORE_B64'] and os.environ['STORE_PASSWORD'] and os.environ['KEY_ALIAS'] and os.environ['KEY_PASSWORD']
          pathlib.Path('sign.jks').write_bytes(__import__('base64').b64decode(os.environ['KEYSTORE_B64'],validate=True))
          PY
          python scripts/quality.py candidate candidate/app-release-unsigned.apk --out inspected.json --aapt "$ANDROID_HOME/build-tools/34.0.0/aapt"
          $ANDROID_HOME/build-tools/34.0.0/zipalign -f -v 4 candidate/app-release-unsigned.apk aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/zipalign -c -v 4 aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks sign.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out Ivy-Wallet.apk aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose Ivy-Wallet.apk
          sha256sum Ivy-Wallet.apk > Ivy-Wallet.apk.sha256
      - name: Draft GitHub release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh release create "candidate-${{ inputs.head_sha }}" Ivy-Wallet.apk Ivy-Wallet.apk.sha256 --draft --title "Verified candidate ${{ inputs.head_sha }}" --notes "Signed promotion of successful Quality run ${{ inputs.run_id }} at ${{ inputs.head_sha }}."
      - name: Remove signing material
        if: always()
        run: rm -f sign.jks
