name: Android integration
on:
  workflow_call:
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 35]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pinned-java
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/setup-project-android
      - run: python scripts/verify_environment.py --out build/environment.json
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          script: ./gradlew :shared:data:core:connectedDebugAndroidTest :shared:domain:connectedDebugAndroidTest
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports-api-${{ matrix.api-level }}
          if-no-files-found: warn
          path: |
            build/environment.json
            **/build/reports/androidTests/**
