name: Setup pinned Java
description: Read .java-version and provision exact Temurin JDK
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: |
        v=$(tr -d '\r\n' < .java-version)
        if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?\+[0-9]+$'; then
          echo "Invalid version: $v" >&2
          exit 1
        fi
        echo "version=$v" >> "$GITHUB_OUTPUT"
    # v6.1.0 supports exact JEP 322 patch/build requests through java-version.
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
      with:
        distribution: temurin
        java-version: ${{ steps.pin.outputs.version }}
